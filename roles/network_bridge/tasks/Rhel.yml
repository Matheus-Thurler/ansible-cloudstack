---
- name: Install Bridge Utils
  dnf:
    name: bridge-utils
    state: present

- name: Get default gateway
  shell: "ip route | grep default | awk '{print $3}'"
  register: default_gateway
  changed_when: false

- name: Get physical network interface name
  shell: "nmcli -t -f DEVICE,TYPE device | grep ethernet | cut -d: -f1 | grep -vE '^(vnet|virbr|cloudbr|docker|podman|veth)' | head -n1"
  register: net_interface
  changed_when: false

- name: Check if cloudbr0 already exists
  command: nmcli connection show cloudbr0
  register: cloudbr0_exists
  ignore_errors: yes
  changed_when: false

- name: Check if bridge slave exists
  shell: "nmcli -t -f NAME,TYPE con show | grep ':bridge-slave$' | grep '{{ net_interface.stdout }}'"
  register: bridge_slave_exists
  ignore_errors: yes
  changed_when: false

- name: Create cloudbr0 bridge (if not exists)
  command: nmcli connection add type bridge autoconnect yes con-name cloudbr0 ifname cloudbr0
  when: 
    - create_cloudbr0 | bool
    - cloudbr0_exists.rc != 0

- name: Add interface to bridge (slave)
  command: nmcli connection add type bridge-slave autoconnect yes con-name bridge-slave-{{ net_interface.stdout }} ifname {{ net_interface.stdout }} master cloudbr0
  when: 
    - create_cloudbr0 | bool
    - cloudbr0_exists.rc != 0

- name: Configure cloudbr0 with static IP
  command: >
    nmcli connection modify cloudbr0
    ipv4.addresses '{{ management_server_ip }}/24'
    ipv4.gateway '{{ default_gateway.stdout }}'
    ipv4.dns '{{ dns1 }} {{ dns2 }}'
    ipv4.method manual
  when: 
    - create_cloudbr0 | bool
    - cloudbr0_exists.rc != 0

- name: Bring down old interface connection
  command: nmcli connection down {{ net_interface.stdout }}
  when: 
    - create_cloudbr0 | bool
    - cloudbr0_exists.rc != 0
  ignore_errors: yes

- name: Bring up cloudbr0
  command: nmcli connection up cloudbr0
  when: create_cloudbr0 | bool

# VLAN Configuration
- name: Create VLAN interfaces
  command: >
    nmcli connection add type vlan con-name {{ item.name }} ifname {{ net_interface.stdout }}.{{ item.id }} dev {{ net_interface.stdout }} id {{ item.id }}
  loop: "{{ vlans }}"
  when: configure_vlans | bool
  ignore_errors: yes

- name: Create Bridge for VLANs
  command: >
    nmcli connection add type bridge autoconnect yes con-name bre{{ net_interface.stdout }}-{{ item.id }} ifname bre{{ net_interface.stdout }}-{{ item.id }}
  loop: "{{ vlans }}"
  when: configure_vlans | bool
  ignore_errors: yes

- name: Slave VLAN to Bridge
  command: >
    nmcli connection modify {{ item.name }} slave-type bridge master bre{{ net_interface.stdout }}-{{ item.id }}
  loop: "{{ vlans }}"
  when: configure_vlans | bool
  ignore_errors: yes

- name: Configure Bridge IPs
  command: >
    nmcli connection modify bre{{ net_interface.stdout }}-{{ item.id }} ipv4.addresses {{ item.ip }} ipv4.method manual
  loop: "{{ vlans }}"
  when: configure_vlans | bool
  ignore_errors: yes

- name: Bring up Bridges
  command: nmcli connection up bre{{ net_interface.stdout }}-{{ item.id }}
  loop: "{{ vlans }}"
  when: configure_vlans | bool

- name: Bring up VLANs
  command: nmcli connection up {{ item.name }}
  loop: "{{ vlans }}"
  when: configure_vlans | bool
